<!DOCTYPE html>

<html class="h-full" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Yelo Pro - Créer Étape 1</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'yelo-teal': '#116d76',
            'yelo-light-teal': '#5fb8c2',
            'yelo-bg-light': '#f0f9fa',
            'yelo-accent': '#0ea5e9',
          },
          fontFamily: {
            sans: ['Montserrat', 'sans-serif'],
          },
        }
      }
    }
  </script>
<style data-purpose="custom-layout">
    body {
      -webkit-tap-highlight-color: transparent;
      overflow: hidden; /* Maintain single screen layout */
    }
    
    .status-bar-safe {
      padding-top: env(safe-area-inset-top);
    }
    
    .bottom-nav-safe {
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* Custom scrollbar-less look for the main container */
    .main-scroll-area {
      height: calc(100vh - 150px);
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .main-scroll-area::-webkit-scrollbar {
      display: none;
    }

    .glass-effect {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(4px);
    }

    .ambiance-card {
      height: 48px;
      background-size: cover;
      background-position: center;
    }

<body class="bg-white font-sans text-gray-800 h-full flex flex-col">
<!-- BEGIN: Top Header -->
<header class="status-bar-safe text-center py-2 border-b border-gray-100 flex-shrink-0">
<h1 class="text-sm font-bold text-gray-900">Créer - Étape 1 Personnalisée (Yelo Pro)</h1>
</header>
<!-- END: Top Header -->
<!-- BEGIN: Main Content Area -->
<main class="flex-grow main-scroll-area px-4 pt-4 pb-24">
<!-- Hero Text -->
<div class="text-center mb-6">
<h2 class="text-3xl font-extrabold text-gray-900 mb-1">Préparons ton histoire...</h2>
<p class="text-sm text-gray-600 px-8">Choisis les ingrédients de ta prochaine aventure magique.</p>
</div>
<!-- BEGIN: Section Pour qui -->
<section class="mb-5" data-purpose="target-audience">
<div class="flex items-center mb-2">
<span class="w-2 h-2 rounded-full bg-yelo-teal mr-2"></span>
<h3 class="text-sm font-bold text-gray-800">Pour qui ?</h3>
</div>
<div class="grid grid-cols-4 gap-2">
<!-- Tout Petit -->
<button class="flex flex-col items-center justify-center p-2 border-2 border-yelo-light-teal rounded-xl">
<svg class="w-8 h-8 text-yelo-teal mb-1" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path></svg>
<span class="text-[10px] font-bold">Tout Petit</span>
</button>
<!-- Enfant -->
<button class="flex flex-col items-center justify-center p-2 border-2 border-yelo-light-teal rounded-xl">
<svg class="w-8 h-8 text-yelo-teal mb-1" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path></svg>

<svg class="w-8 h-8 text-yelo-teal mb-1" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path></svg>
<span class="text-[10px] font-bold">Adolescent</span>
</button>
<!-- Adulte (Selected) -->
<button class="flex flex-col items-center justify-center p-2 bg-yelo-light-teal border-2 border-yelo-light-teal rounded-xl shadow-sm">
<svg class="w-8 h-8 text-yelo-teal mb-1" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path></svg>

<button class="bg-yelo-teal text-white py-2 rounded-full text-sm font-semibold shadow-sm">Adventure</button>
<button class="bg-yelo-bg-light text-gray-800 py-2 rounded-full text-sm font-semibold">Romance</button>
<button class="bg-yelo-bg-light text-gray-800 py-2 rounded-full text-sm font-semibold">Comedy</button>
<button class="bg-yelo-bg-light text-gray-800 py-2 rounded-full text-sm font-semibold">Fantasy</button>
<button class="bg-yelo-bg-light text-gray-800 py-2 rounded-full text-sm font-semibold">Sci-Fi</button>
<button class="bg-yelo-bg-light text-gray-800 py-2 rounded-full text-sm font-semibold">Mystery</button>

<span class="relative z-10 text-white font-bold">Humour</span>
</div>
</div>
</div>
</section>
<!-- END: Section Quelle ambiance -->
<!-- BEGIN: Section Durée -->
<section class="mb-6" data-purpose="duration-selection">
<div class="flex items-center mb-2">
<span class="w-2 h-2 rounded-full bg-yelo-teal mr-2"></span>
<h3 class="text-sm font-bold text-gray-800">Durée</h3>
</div>
<div class="flex gap-2">
<button class="flex-1 py-2 bg-yelo-light-teal rounded-lg text-sm font-bold text-gray-800">2 min</button>
<button class="flex-1 py-2 bg-yelo-light-teal rounded-lg text-sm font-bold text-gray-800">5 min</button>

<button class="flex-1 py-2 bg-yelo-light-teal rounded-lg text-sm font-bold text-gray-800">20 min</button>

<!-- BEGIN: Action Button -->
<div class="mt-auto px-1">
<button class="w-full bg-yelo-teal text-white py-4 rounded-xl flex items-center justify-center gap-2 text-lg font-bold shadow-lg">

<button class="flex flex-col items-center">
<div class="bg-yelo-light-teal p-1.5 rounded-xl mb-0.5">
<svg class="w-6 h-6 text-yelo-teal" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</div>
<span class="text-[10px] font-bold text-yelo-teal">Créer</span>
</button>
<button class="flex flex-col items-center text-gray-500">
<svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path></svg>

</button>
<button class="flex flex-col items-center text-gray-500">
